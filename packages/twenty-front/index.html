<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/enki-logo.svg"
      data-rh="true"
    />

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#f8f7e9" />
    <meta name="description" content="Enki · Pessoas, agentes e relacionamentos conectados" />
    <meta
      property="og:image"
      content="/brand/enki-logo.svg"
    />
    <meta property="og:description" content="Enki · Pessoas, agentes e relacionamentos conectados" />
    <meta property="og:title" content="Enki" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/brand/enki-logo.svg"
    />

    <meta name="twitter:description" content="Enki · Pessoas, agentes e relacionamentos conectados" />
    <meta name="twitter:title" content="Enki" />
    <title>Enki</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* react-data-grid declares its layer when it loads; keep it below twenty-ui. */
      @layer rdg, twenty-ui;

      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #26241f;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #f8f7e9;
      }

      .enki-boot {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        color: #777268;
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
      }

      .enki-boot img { width: 128px; height: 64px; object-fit: contain; margin-bottom: 24px; }
      .enki-boot p { margin: 0; }
      .enki-boot a { color: inherit; padding: 12px 20px; margin-top: 24px; text-underline-offset: 4px; }

      @media (prefers-color-scheme: dark) {
        .enki-boot { color: #c1bba9; }
        .enki-boot img { filter: invert(1); }
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="enki-boot">
        <img src="/brand/enki-logo.svg" alt="Enki" />
        <p role="status">Preparando seu espaço…</p>
        <a href="">Recarregar</a>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
